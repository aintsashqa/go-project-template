services:
  api:
    build:
      context: ..
      dockerfile: ./cmd/service/Dockerfile
    ports:
      - 50051:50051
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    env_file:
      - ../.env
    volumes:
      - ../temp/postgres/data:/var/lib/postgresql/data
      - ../scripts/init_databases.sh:/docker-entrypoint-initdb.d/init_databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
